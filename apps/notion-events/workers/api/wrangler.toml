name = "personal-notion-events"
main = "index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false

# Examples only. Use a separate private personal deployment configuration.
# Never reuse another installation's OAuth KV, Durable Object namespaces or secrets.
[vars]
PUBLIC_ORIGIN = "https://notion-events.example.invalid"
EVENTS_OBJECT_NAME = "personal-notion-events"
OAUTH_OWNER_ID = "sample-personal-owner"
NOTION_WORKSPACE_ID = "11111111-1111-4111-8111-111111111111"
NOTION_INTEGRATION_ID = "22222222-2222-4222-8222-222222222222"
NOTION_SUBSCRIPTION_ID = "33333333-3333-4333-8333-333333333333"
NOTION_BOT_USER_ID = "44444444-4444-4444-8444-444444444444"
NOTION_PAGE_IDS = '["55555555-5555-4555-8555-555555555555"]'
NOTION_IGNORED_AUTHOR_IDS = '[]'

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "00000000000000000000000000000000"

[[durable_objects.bindings]]
name = "EVENTS"
class_name = "NotionEvents"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NotionEvents"]
